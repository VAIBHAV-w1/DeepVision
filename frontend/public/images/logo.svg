<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 44" fill="none">
  <!-- Camera Aperture Emblem -->
  <g transform="translate(4, 4)">
    <!-- Outer Shield / Housing -->
    <rect x="0" y="0" width="36" height="36" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
    <!-- Optical Lens Outer Ring -->
    <circle cx="18" cy="18" r="11" stroke="#2563eb" stroke-width="2" fill="#111c30"/>
    <!-- Lens Iris / Pupil -->
    <circle cx="18" cy="18" r="5" fill="#2563eb"/>
    <!-- Optical Glint -->
    <circle cx="15.5" cy="15.5" r="1.5" fill="#60a5fa"/>
    <!-- Active Live Recording Beacon -->
    <circle cx="28" cy="8" r="2.5" fill="#10b981"/>
  </g>
  
  <!-- Typography -->
  <!-- Brand Name -->
  <text x="48" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" letter-spacing="1.5" fill="currentColor" class="logo-title">DEEPVISION</text>
  <!-- Subtitle -->
  <text x="48" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" letter-spacing="2" fill="#2563eb" class="logo-subtitle">SMART SURVEILLANCE</text>
</svg>