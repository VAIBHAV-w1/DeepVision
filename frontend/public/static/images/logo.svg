<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 48" fill="none">
  <!-- Outer Hexagonal Reticle -->
  <g transform="translate(4, 3)">
    <polygon points="21,2 37,11 37,31 21,40 5,31 5,11" stroke="#10b981" stroke-width="2.5" stroke-linejoin="round" fill="rgba(16, 185, 129, 0.08)" />
    <!-- Optical Sensor Ring -->
    <circle cx="21" cy="21" r="11" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="3.5 2" opacity="0.75" />
    <!-- Inner Precision Aperture Ring -->
    <circle cx="21" cy="21" r="6.5" stroke="#10b981" stroke-width="2" fill="rgba(16, 185, 129, 0.2)" />
    <!-- Central Iris Focal Point -->
    <circle cx="21" cy="21" r="3" fill="#10b981" />
    <!-- Crosshairs -->
    <line x1="21" y1="4" x2="21" y2="8" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <line x1="21" y1="34" x2="21" y2="38" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <line x1="7" y1="21" x2="11" y2="21" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <line x1="31" y1="21" x2="35" y2="21" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <text x="54" y="25" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800" letter-spacing="1.2" fill="#f8fafc">DEEP<tspan fill="#10b981">VISION</tspan></text>
  <text x="54" y="38" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" letter-spacing="2" fill="#94a3b8">INTELLIGENT SURVEILLANCE SOC</text>
</svg>