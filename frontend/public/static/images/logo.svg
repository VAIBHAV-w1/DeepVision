<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" fill="none" width="240" height="48">
  <defs>
    <linearGradient id="dv-logo-grad" x1="0" y1="0" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00C9FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>
    <filter id="dv-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00C9FF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Canonical DeepVision Surveillance Camera Emblem -->
  <g transform="translate(4, 5)" filter="url(#dv-shadow)">
    <rect width="38" height="38" rx="8" fill="url(#dv-logo-grad)"/>
    <g transform="translate(7, 7)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M4 17.5v3.5h5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2.5 7.5h13l4.5 3" stroke="#00F5D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2.5 9h11.5l4 3v3l-4 3H2.5a1.5 1.5 0 0 1-1.5-1.5v-6A1.5 1.5 0 0 1 2.5 9z" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="7.5" cy="13.5" r="2.2" stroke="#00F5D4" stroke-width="1.8"/>
        <circle cx="7.5" cy="13.5" r="0.8" fill="#00F5D4"/>
        <line x1="19.5" y1="13.5" x2="22.5" y2="13.5" stroke="#00F5D4" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </g>
  </g>

  <!-- Typography Wordmark -->
  <text x="54" y="31"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif"
        font-weight="800"
        font-size="22"
        letter-spacing="-0.02em"
        fill="#FFFFFF">DeepVision</text>
</svg>
