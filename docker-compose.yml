services:
  deepvision:
    build:
      context: .
      dockerfile: Dockerfile
    image: deepvision:1.1.0
    container_name: deepvision-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEEPVISION_HOST=0.0.0.0
      - DEEPVISION_PORT=8000
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=127.0.0.1,localhost,0.0.0.0,deepvision-app
      - DJANGO_CSRF_TRUSTED_ORIGINS=http://127.0.0.1:8000,http://localhost:8000,http://0.0.0.0:8000
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dv-sec-prod-entropy-key-9f8a3c7e2b1d4f6a8e0c2b4d6f8a1c3e5b7d9f0a2c4e6b8d0f1a3c5e7b9d}
    volumes:
      - ./instance:/app/instance
      - ./models:/app/models
      - ./recordings:/app/recordings
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
