
name: DeepVision CI/CD & Automated Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Lint, Build, and Regression Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          npm --prefix frontend ci || npm --prefix frontend install

      - name: Run Frontend Lint
        run: |
          npm --prefix frontend run lint

      - name: Build Frontend (Vercel Production Target)
        env:
          BUILD_TARGET: vercel
        run: |
          npm --prefix frontend run build

      - name: Build Frontend (Django Static Target)
        run: |
          npm --prefix frontend run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies (CPU-only PyTorch & Single OpenCV)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip uninstall -y opencv-python || true
          pip install --no-cache-dir opencv-python-headless>=4.8.0

      - name: Verify CSP & Infinite Loader Guard
        run: |
          python verification/test_csp_and_startup_loader.py

      - name: Build Application Docker Image
        run: |
          docker build -t deepvision:ci .

      - name: Start Docker Container & Await Health Check
        run: |
          docker run -d --name deepvision-service -p 8000:8000 \
            -e DJANGO_SECRET_KEY=ci_test_secret_key_12345678901234567890 \
            -e DJANGO_DEBUG=False \
            -e DJANGO_ALLOWED_HOSTS=* \
            -e INIT_DB_IF_MISSING=true \
            deepvision:ci
          echo "Waiting for container health check on http://127.0.0.1:8000/api/health/..."
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:8000/api/health/; do sleep 2; done'
          echo "Container is online and healthy!"

      - name: Verify Full System E2E Suite
        run: |
          python verification/test_e2e_full_system.py

      - name: Verify YOLO11n & ByteTrack Engine
        run: |
          python verification/test_yolo_and_tracker.py

      - name: Verify Secret Safety Scan
        run: |
          python -c "
          import re, subprocess, sys
          sensitive_patterns = [
              re.compile(r'-----BEGIN (?:RSA |EC )?PRIVATE KEY-----'),
              re.compile(r'postgres://[^:]+:[^@]+@'),
              re.compile(r'postgresql://[^:]+:[^@]+@'),
              re.compile(r'smtp_password\s*=\s*[\'\"][^\'\"]{8,}[\'\"]', re.IGNORECASE)
          ]
          files = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          leaks = []
          for f in files:
              if f.endswith(('.py', '.js', '.jsx', '.json', '.html', '.yml', '.yaml')):
                  if 'test_e2e_full_system.py' in f:
                      continue
                  try:
                      with open(f, 'r', encoding='utf-8', errors='ignore') as content:
                          text = content.read()
                      for p in sensitive_patterns:
                          if p.search(text):
                              leaks.append((f, p.pattern))
                  except Exception:
                      pass
          if leaks:
              print(f'CRITICAL: Found secrets in repository: {leaks}')
              sys.exit(1)
          print('Secret scan clean: 0 credentials leaked.')
          "

      - name: Stop and Cleanup Docker Container
        if: always()
        run: |
          docker stop deepvision-service || true
          docker rm deepvision-service || true
