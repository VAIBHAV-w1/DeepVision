name: DeepVision CI/CD & Automated Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Lint, Build, and Regression Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Frontend Dependencies
        run: |
          npm --prefix frontend ci || npm --prefix frontend install

      - name: Run Frontend Lint
        run: |
          npm --prefix frontend run lint

      - name: Build Frontend (Vercel Production Target)
        env:
          BUILD_TARGET: vercel
        run: |
          npm --prefix frontend run build

      - name: Install Core Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests torch torchvision ultralytics opencv-python-headless numpy django

      - name: Verify CSP & Infinite Loader Guard
        run: |
          python verification/test_csp_and_startup_loader.py

      - name: Verify Full System E2E Suite
        run: |
          python verification/test_e2e_full_system.py

      - name: Verify YOLO11n & ByteTrack Engine
        run: |
          python verification/test_yolo_and_tracker.py
