name: DeepVision CI/CD & Automated Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Lint, Build, and Regression Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          npm --prefix frontend ci || npm --prefix frontend install

      - name: Run Frontend Lint
        run: |
          npm --prefix frontend run lint

      - name: Build Frontend (Vercel Production Target)
        env:
          BUILD_TARGET: vercel
        run: |
          npm --prefix frontend run build

      - name: Build Frontend (Django Static Target)
        run: |
          npm --prefix frontend run build

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies (OpenVINO, ONNX Runtime & Single OpenCV)
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          pip uninstall -y opencv-python || true
          pip install --no-cache-dir "opencv-python-headless>=4.8.0"
          python -c "import cv2, openvino, onnxruntime; print('OpenCV:', cv2.__version__, 'OV:', openvino.__version__, 'ORT:', onnxruntime.__version__)"

      - name: Fetch and Verify Official YOLO26 ONNX Weights (SHA-256)
        run: |
          mkdir -p models instance/ov_cache
          curl -fL --retry 3 --retry-all-errors \
            "https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo26s.onnx" \
            -o models/yolo26s.onnx
          curl -fL --retry 3 --retry-all-errors \
            "https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo26n.onnx" \
            -o models/yolo26n.onnx
          echo "d26b65c432111eb95798cd2320603d4d75627605dbec6c6b7f98c499a80e7321  models/yolo26s.onnx" | sha256sum -c -
          echo "2e947b787d9e787b93a16772a5f55b1d4d8c4d86f53146149c5d6a642442d6f7  models/yolo26n.onnx" | sha256sum -c -

      - name: Run Django Account and Surveillance Unit Tests
        run: |
          cd deepvision_django
          python manage.py check
          python manage.py test apps.accounts.tests apps.surveillance.tests --verbosity 2

      - name: Verify CSP & Infinite Loader Guard
        run: |
          python verification/test_csp_and_startup_loader.py

      - name: Build Application Docker Image
        run: |
          docker build -t deepvision:ci .

      - name: Start Docker Container & Await Health Check
        run: |
          set -e
          mkdir -p instance recordings
          chmod 777 instance recordings
          docker run -d --name deepvision-service -p 8000:8000 \
            -v "$PWD/instance:/app/instance" \
            -v "$PWD/recordings:/app/recordings" \
            -e DJANGO_SECRET_KEY=ci_test_secret_key_12345678901234567890 \
            -e DJANGO_DEBUG=True \
            -e DEEPVISION_ENV=development \
            -e DJANGO_ALLOWED_HOSTS=127.0.0.1,localhost,testserver \
            -e INIT_DB_IF_MISSING=true \
            -e MAIL_SERVER=smtp.example.test \
            -e MAIL_PORT=587 \
            -e MAIL_USERNAME=ci-placeholder \
            -e MAIL_PASSWORD=ci-placeholder-only-not-a-real-secret \
            -e MAIL_USE_TLS=true \
            -e MAIL_DEFAULT_SENDER=deepvision-ci@example.test \
            deepvision:ci
          echo "Waiting for container health check on http://127.0.0.1:8000/api/health/..."
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health/; then
              echo "Container is online and healthy!"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' deepvision-service 2>/dev/null || echo false)" != "true" ]; then
              echo "Container exited before becoming healthy."
              docker logs deepvision-service || true
              exit 1
            fi
            sleep 2
          done
          docker logs deepvision-service || true
          exit 1

      - name: Prepare Disposable E2E Volume Permissions
        run: |
          docker exec --user root deepvision-service sh -lc 'chmod -R a+rwX /app/instance /app/recordings'

      - name: Verify Full System E2E Suite
        env:
          DJANGO_SECRET_KEY: ci_test_secret_key_12345678901234567890
          DJANGO_DEBUG: "True"
          DEEPVISION_ENV: development
        run: |
          python verification/test_e2e_full_system.py

      - name: Verify YOLO26s ONNX & BoT-SORT+ReID Engine
        env:
          DEEPVISION_STRICT_NATIVE_AI: "1"
        run: |
          python verification/test_yolo_and_tracker.py

      - name: Verify Secret Safety Scan
        run: |
          python -c "
          import re, subprocess, sys
          sensitive_patterns = [
              re.compile(r'-----BEGIN (?:RSA |EC )?PRIVATE KEY-----'),
              re.compile(r'postgres://[^:]+:[^@]+@'),
              re.compile(r'postgresql://[^:]+:[^@]+@'),
              re.compile(r'smtp_password\s*=\s*[\'\"][^\'\"]{8,}[\'\"]', re.IGNORECASE)
          ]
          files = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          leaks = []
          for f in files:
              if f.endswith(('.py', '.js', '.jsx', '.json', '.html', '.yml', '.yaml')):
                  if 'test_e2e_full_system.py' in f or 'ci.yml' in f or f.startswith('reports/'):
                      continue
                  try:
                      with open(f, 'r', encoding='utf-8', errors='ignore') as content:
                          text = content.read()
                      for p in sensitive_patterns:
                          if p.search(text):
                              leaks.append((f, p.pattern))
                  except Exception:
                      pass
          if leaks:
              print(f'CRITICAL: Found secrets in repository: {leaks}')
              sys.exit(1)
          print('Secret scan clean: 0 credentials leaked.')
          "

      - name: Stop and Cleanup Docker Container
        if: always()
        run: |
          docker stop deepvision-service || true
          docker rm deepvision-service || true

  verify-native-ai:
    name: Native YOLO26s ONNX + BoT-SORT ReID Verification (Ubuntu CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SECRET_KEY: ci_native_ai_test_key_12345678901234567890
      DJANGO_DEBUG: "True"
      DEEPVISION_ENV: development
      OPENVINO_TELEMETRY: "0"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Libraries & Verified ONNX Runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libgomp1 curl
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          pip uninstall -y opencv-python || true
          pip install --no-cache-dir opencv-python-headless==5.0.0.93

      - name: Fetch and Verify YOLO26s & YOLO26n ONNX Weights SHA-256
        run: |
          mkdir -p models instance/ov_cache
          curl -fL --retry 3 --retry-all-errors \
            "https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo26s.onnx" \
            -o models/yolo26s.onnx
          curl -fL --retry 3 --retry-all-errors \
            "https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo26n.onnx" \
            -o models/yolo26n.onnx
          echo "d26b65c432111eb95798cd2320603d4d75627605dbec6c6b7f98c499a80e7321  models/yolo26s.onnx" | sha256sum -c -
          echo "2e947b787d9e787b93a16772a5f55b1d4d8c4d86f53146149c5d6a642442d6f7  models/yolo26n.onnx" | sha256sum -c -

      - name: Verify Native ONNX Imports & Versions
        run: |
          python -c "
          import sys, django, openvino, onnxruntime, cv2, numpy, yaml
          print('Python:', sys.version)
          print('Django:', django.__version__)
          print('OpenVINO:', openvino.__version__)
          print('ONNX Runtime:', onnxruntime.__version__)
          print('OpenCV:', cv2.__version__)
          print('NumPy:', numpy.__version__)
          "

      - name: Run Strict Native YOLO26s + BoT-SORT+ReID Deterministic Verification
        env:
          DEEPVISION_STRICT_NATIVE_AI: "1"
          PYTHONPATH: deepvision_django
        run: |
          python verification/test_yolo_and_tracker.py
          python -c "
          import importlib.util
          import numpy as np
          spec = importlib.util.spec_from_file_location('matching', 'deepvision_django/apps/surveillance/ai/trackers/matching.py')
          matching = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(matching)
          r, c = matching.linear_sum_assignment(np.array([[1.0, 9.0], [8.0, 2.0]]))
          assert list(zip(r.tolist(), c.tolist())) == [(0, 0), (1, 1)]
          print('Pure-NumPy Crouse linear_sum_assignment parity PASS')
          "

      - name: Run Focused Django & Surveillance Regression Suite
        run: |
          cd deepvision_django
          python manage.py check
          python manage.py test apps.surveillance.tests apps.accounts.tests --verbosity 2
